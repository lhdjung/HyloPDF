# The installers, and the links a person clicks to get one.
#
# One place, called twice: `nightly.yml` on every push to main and `release.yml`
# when a version is named. Packaging is the part that is easy to get subtly
# wrong twice, so it is not written twice.
#
# **The asset names carry no version.** A release's own tag says which version
# it is, and a fixed name is what lets the notes below be a fixed template —
# the whole point of this file is that the links work without anybody editing
# them.

name: Bundle

on:
  workflow_call:
    inputs:
      tag:
        description: The release to build into. It has to exist already.
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  PDFIUM_TAG: "chromium%2F8021"

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not take the others down with it: three
      # installers and a note about the fourth beats nothing at all.
      fail-fast: false
      matrix:
        include:
          # Both macOS builds run on Apple silicon and the Intel one
          # cross-compiles, because the Intel runners were retired at the end of
          # 2025. Apple's toolchain targets either architecture from either
          # host, and bundling never runs what it built. Two DMGs rather than
          # one universal build: a universal installer carries both
          # architectures to run one of them, and the brief asks for a small
          # binary.
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            formats: dmg
            pdfium: pdfium-mac-arm64.tgz
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            formats: dmg
            pdfium: pdfium-mac-x64.tgz
          # 22.04 rather than the newest Ubuntu on purpose: a Linux binary runs
          # on the glibc it was built against and anything newer, never
          # anything older, so the runner's age is what decides whether the
          # `.deb` installs on Debian stable.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            formats: deb,appimage
            pdfium: pdfium-linux-x64.tgz
          # Both: `-setup.exe` is what a person downloads and runs, and the
          # `.msi` is what deploys to a hundred machines at once. NSIS is named
          # first because it is the one the notes lead with.
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            formats: nsis,wix
            pdfium: pdfium-win-x64.tgz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: System libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev fonts-dejavu-core patchelf

      # pdfium travels inside the bundle — `Contents/Frameworks` in the `.app`,
      # `/usr/lib/HyloPDF` in the `.deb`, beside the `.exe` on Windows — and
      # `resources` and `frameworks` in `Cargo.toml` are what put it there. The
      # Intel DMG needs the Intel library even though an Apple silicon runner
      # built it.
      - name: pdfium
        shell: bash
        run: |
          mkdir -p pdfium
          curl -sSfL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/${{ matrix.pdfium }}"
          tar xzf pdfium.tgz -C pdfium

      - name: cargo-packager
        run: cargo install cargo-packager --locked

      - name: The installers
        shell: bash
        env:
          # linuxdeploy is itself an AppImage and a runner has no FUSE for it to
          # mount itself with; unpacking is the supported way round that.
          # NO_STRIP because the runner's strip is newer than the libraries it
          # is handed and errors rather than skipping them.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }}
          cargo packager --release --target ${{ matrix.target }} \
            --formats ${{ matrix.formats }}

      # **The `.rpm` is converted, not built.** `cargo-packager` 0.11 makes
      # `app`, `dmg`, `wix`, `nsis`, `deb`, `appimage` and `pacman` and nothing
      # else — it says so when asked for anything else — so Fedora's format
      # comes from `alien` over the `.deb` that was just built. It is checked
      # before it is kept: an `.rpm` that does not carry the binary is worse
      # than no `.rpm` at all, because the AppImage beside it runs anywhere.
      - name: And the .rpm, if it converts cleanly
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get install -y alien rpm >/dev/null
          cd "target/${{ matrix.target }}/release"
          if ! sudo alien --to-rpm --keep-version --scripts ./*.deb; then
            echo "alien could not convert it; no .rpm this time." >&2
            exit 0
          fi
          sudo chown "$USER" ./*.rpm 2>/dev/null || true
          for f in ./*.rpm; do
            if rpm -qlp "$f" | grep -q 'HyloPDF'; then
              echo "keeping $f"
            else
              echo "$f carries nothing recognisable; dropping it." >&2
              rm -f "$f"
            fi
          done

      # The bundler names its output after the version; the release is named
      # after the version. One of the two has to be fixed for the notes to be
      # able to link to it, and it is this one.
      - name: Under the names the notes link to
        id: rename
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "target/${{ matrix.target }}/release"
          for f in *.dmg;       do mv "$f" "HyloPDF-macos-${{ matrix.arch }}.dmg"; done
          for f in *.deb;       do mv "$f" "HyloPDF-linux-amd64.deb"; done
          for f in *.rpm;       do mv "$f" "HyloPDF-linux-x86_64.rpm"; done
          for f in *.AppImage;  do mv "$f" "HyloPDF-linux-x86_64.AppImage"; done
          for f in *setup.exe;  do mv "$f" "HyloPDF-windows-setup.exe"; done
          for f in *.msi;       do mv "$f" "HyloPDF-windows.msi"; done
          ls -lh HyloPDF-*

      # `--clobber` rather than a plain upload, because a re-run lands on a
      # release that already has the asset.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "target/${{ matrix.target }}/release"
          gh release upload "${{ inputs.tag }}" HyloPDF-* --clobber

  notes:
    name: The download links
    needs: package
    # Three installers and a link to a fourth that is not there beats a release
    # whose notes nobody wrote.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Put them at the top of the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          body=$(gh release view "$TAG" --json body --jq .body)
          # A re-run must not stack a second copy of the table on the first.
          if printf '%s' "$body" | grep -q '^### Download'; then
            echo "The notes already carry the links."
            exit 0
          fi
          dl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          # `|| true` on the alternates below is not decoration: `set -e` kills
          # the step on a failing `a && b`, and "this asset is not there" is
          # exactly that.
          #
          # Only what is actually attached gets a link. A platform whose build
          # failed is a line that is not written, rather than a link that leads
          # to a 404 — and the alternates below (`.msi`, `.rpm`) are formats
          # that may not have been produced at all.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          have() { printf '%s\n' "$assets" | grep -qx "$1"; }
          link() { printf '[%s](%s/%s)' "$1" "$dl" "$2"; }

          # A list rather than a table, and one line per platform: somebody who
          # has never heard of CI should find their download in the first two
          # seconds, without reading the word "asset".
          {
            echo "### Download"
            echo
            if have HyloPDF-macos-arm64.dmg; then
              printf -- '- %s — Apple silicon' "$(link macOS HyloPDF-macos-arm64.dmg)"
              have HyloPDF-macos-x64.dmg && printf ', or %s' "$(link Intel HyloPDF-macos-x64.dmg)" || true
              echo
            fi
            if have HyloPDF-windows-setup.exe; then
              printf -- '- %s' "$(link Windows HyloPDF-windows-setup.exe)"
              have HyloPDF-windows.msi && printf ' — or an %s' "$(link .msi HyloPDF-windows.msi)" || true
              echo
            fi
            if have HyloPDF-linux-x86_64.AppImage; then
              printf -- '- %s — an AppImage' "$(link Linux HyloPDF-linux-x86_64.AppImage)"
              have HyloPDF-linux-amd64.deb && printf ', or %s' "$(link .deb HyloPDF-linux-amd64.deb)" || true
              have HyloPDF-linux-x86_64.rpm && printf ' · %s' "$(link .rpm HyloPDF-linux-x86_64.rpm)" || true
              echo
            fi
            echo
            echo "Neither the macOS app nor the Windows installer is signed by a certificate your system has heard of, so both are refused on first launch. On macOS, open *System Settings → Privacy & Security* and click *Open Anyway*; on Windows, click *More info* → *Run anyway*."
            echo
            printf '%s\n' "$body"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
