# HyloPDF ships to three platforms with three different web engines, and the
# ones it is not developed on are the ones that break: WebKitGTK on Linux and
# WebView2 on Windows disagree with WKWebView about exactly the things this app
# leans on — canvas blend modes, pinch gestures, text layout. Building on all
# three on every push is the cheapest way to hear about it from a machine
# rather than from a reader.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run check
      - name: Browsers for the interface tests
        run: npx playwright install --with-deps webkit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # What these cover is concurrency and file-system timing — two settings
      # written at once, and a document caught halfway through being written by
      # a compiler. Both break quietly and neither reproduces on demand, so a
      # machine has to be the one asking.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      # Signing is the one thing this cannot do without secrets. On macOS an
      # unsigned build is quarantined on any machine but the one that made it,
      # and on Windows it draws a SmartScreen warning — so a release workflow
      # has to supply these, and the Tauri bundler reads them straight from the
      # environment.
      #
      # It reads them by presence, though, and a secret this repository does not
      # have arrives as an empty string rather than as nothing at all. Named
      # directly in the build step's `env`, `APPLE_CERTIFICATE` is therefore
      # always set, always empty, and always taken as "here is a certificate" —
      # and the build dies at `security import` having compiled perfectly. So
      # they come in under names the bundler does not read, and only the ones
      # carrying something are promoted to the names it does.
      - name: Signing certificates, if this repository has any
        if: matrix.os == 'macos-latest'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY ID PASSWORD TEAM_ID; do
            if [ -n "${!name}" ]; then
              {
                echo "APPLE_$name<<HYLOPDF_EOF"
                echo "${!name}"
                echo "HYLOPDF_EOF"
              } >> "$GITHUB_ENV"
            fi
          done
      - name: Build the app
        run: npm run tauri build -- --ci
