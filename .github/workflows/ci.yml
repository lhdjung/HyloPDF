# Every push to main and every pull request: the suite on macOS, Linux and
# Windows. It checks; it does not release. `release.yml` is the switch for
# that, and it calls the same `checks.yml` before it bundles anything.
#
# The installers are not built here. `nightly.yml` builds them on every push to
# main and hangs them off the rolling `nightly` release, which is where a
# person downloads one from.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
