# Every push to main and every pull request: the suite on macOS, Linux and
# Windows. It checks; it does not release. `release.yml` is the switch for
# that, and it calls the same `checks.yml` before it bundles anything.
#
# The bundle job below is on dispatch only. It is four release builds of a
# crate whose profile is `lto = true, codegen-units = 1`, and nothing about the
# packaging changes between pushes — but when it does change, this is how to
# find out without cutting a release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PDFIUM_TAG: "chromium%2F8021"

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  bundle:
    name: The bundle (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pdfium: pdfium-mac-arm64.tgz
            formats: dmg
          - os: ubuntu-22.04
            pdfium: pdfium-linux-x64.tgz
            formats: deb,appimage
          - os: windows-latest
            pdfium: pdfium-win-x64.tgz
            formats: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.os }}

      - name: What fontconfig and an AppImage need
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev fonts-dejavu-core patchelf

      # Where `resources` and `frameworks` in `Cargo.toml` look, and where
      # `pdfium.rs` then finds it: inside the bundle, beside the executable.
      - name: pdfium
        shell: bash
        run: |
          mkdir -p pdfium
          curl -sSfL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/${{ matrix.pdfium }}"
          tar xzf pdfium.tgz -C pdfium

      - name: cargo-packager
        run: cargo install cargo-packager --locked

      - name: The bundle
        shell: bash
        env:
          # linuxdeploy is an AppImage itself and a runner has no FUSE to mount
          # it with; unpacking is the supported way round that.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cargo build --release
          cargo packager --release --formats ${{ matrix.formats }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/*.dmg
            target/release/*.deb
            target/release/*.AppImage
            target/release/*setup.exe
          if-no-files-found: error
