# The Dioxus Native experiment, on the two platforms it has never run on.
#
# `experiments/PROGRESS.md` has carried this as the third of its "three things
# to carry forward" since Phase 2: nothing in the experiment has ever run on
# Windows or Linux, and HyloPDF ships a `.deb`, an `.rpm`, an AppImage, an
# `.msi` and a `-setup.exe`. The reader's whole suite needs no GPU, no screen
# and no compositor — it draws through `vello_cpu` and asserts on the DOM — so
# running it on three runners is the cheapest possible answer to the largest
# open question in the experiment: whether Stylo, Parley, fontique and Taffy
# behave on engines this was not developed on.
#
# It is a workflow of its own rather than a job in `ci.yml` because the two
# have nothing to share: `ci.yml` is the app, which is Node and Tauri and a
# webview, and this is a crate that is not in the app's workspace and is not
# built by anything the app runs. It is also on a branch rather than on main,
# which is what the `push` filter below says.
#
# What this does not cover is the window: the shell, the cascade, full screen,
# the Dock menu and the Unix socket are the window's rather than the page's and
# cannot be asked without one — see `src/windows.rs`, which is where item 9 put
# the *rules* precisely so that the part that can be tested is.

name: Experiment

on:
  push:
    branches: [dioxus-experiment]
    paths: ["experiments/**", ".github/workflows/experiment.yml"]
  pull_request:
    paths: ["experiments/**", ".github/workflows/experiment.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The pdfium build the experiment was measured against. Written the way the
  # download URL wants it — the tag is `chromium/8021` and the slash is a path
  # separator to GitHub unless it is escaped.
  PDFIUM_TAG: "chromium%2F8021"

jobs:
  reader:
    name: The reader (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither platform's answer is worth losing because the other one
      # failed — the whole point of the job is to find out about both.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pdfium: pdfium-mac-arm64.tgz
            # Where the archive keeps the library, which is not the same on all
            # three: Windows puts the DLL in `bin/` and its import library in
            # `lib/`, and `Pdfium::pdfium_platform_library_name_at_path` wants
            # the directory holding the thing that is actually loaded.
            lib: lib
          - os: ubuntu-latest
            pdfium: pdfium-linux-x64.tgz
            lib: lib
          - os: windows-latest
            pdfium: pdfium-win-x64.tgz
            lib: bin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          # Two crates, two workspaces, two lockfiles — the spike is a
          # workspace of its own for the same reason the reader is, and it is
          # checked at the end of this job.
          workspaces: |
            experiments/dioxus-reader
            experiments/dioxus-spike

      # fontique reads the system's fonts through fontconfig on Linux, and
      # `yeslogic-fontconfig-sys` looks for it with pkg-config at build time —
      # so without the development package the build fails long before any test
      # runs, with a panic out of a build script. `RUST_FONTCONFIG_DLOPEN=1` is
      # that crate's own escape from needing it and is not one here: it changes
      # the crate's API surface enough that `fontique` no longer compiles
      # against it. The fonts themselves matter for a different reason: the
      # toolbar is drawn in whatever `ui-sans-serif` resolves to, and a runner
      # with no fonts at all lays out a document of empty boxes.
      - name: What fontconfig needs, and something to draw with
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev fonts-dejavu-core

      # `Reader::book()` is the app's own 400-page fixture, which the app
      # generates rather than committing — see `tests/fixtures/make-pdf.mjs`.
      # It is the document every memory and timing number in `PROGRESS.md` was
      # taken on, which is the reason the reader's suite reaches for it instead
      # of writing a second one. The generator needs Node and nothing else: no
      # `npm ci`, no dependencies, one file that writes bytes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The app's fixture
        run: node tests/fixtures/make-pdf.mjs tests/fixtures/book.pdf 400

      # pdfium is a shared library and is not in this repository — the same
      # arrangement `vendor/lib` has locally, and `HYLO_PDFIUM` is what
      # `pdfium.rs` reads to find it. Every path below is relative and the one
      # absolute path is GitHub's own, because bash on the Windows runner
      # reports `RUNNER_TEMP` as a Windows path with backslashes in it and
      # cargo's environment wants something a Rust `Path` can open;
      # `github.workspace` with forward slashes after it is understood on all
      # three.
      - name: pdfium
        shell: bash
        run: |
          mkdir -p pdfium
          curl -sSfL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/${{ matrix.pdfium }}"
          tar xzf pdfium.tgz -C pdfium
          echo "HYLO_PDFIUM=${{ github.workspace }}/pdfium/${{ matrix.lib }}" >> "$GITHUB_ENV"

      # Clippy on one runner rather than three: it is the same source and the
      # same lints, and the two things that actually differ between platforms —
      # `cfg(unix)` in `single.rs` and `cfg(target_os = "macos")` in `dock.rs`
      # and `stats.rs` — are compiled by the test build on each of them anyway.
      #
      # There is deliberately no `cargo fmt --check` here, unlike the app's own
      # Rust job. The keymap is one row per action so that it can be read
      # against `keys.ts`, the macro above it is one line per arm, and rustfmt
      # explodes both; the tree is a port that is meant to be read beside the
      # TypeScript it came from. If that ever stops being true, the way to turn
      # this on is `#[rustfmt::skip]` on those tables and one mechanical commit.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --manifest-path experiments/dioxus-reader/Cargo.toml --all-targets -- -D warnings

      # The whole suite. No GPU, no window, no screen: `Reader` builds a
      # `DioxusDocument`, resolves style and layout against a stated viewport,
      # and draws pages through pdfium into `ImageData` on the CPU.
      - name: Tests
        run: cargo test --manifest-path experiments/dioxus-reader/Cargo.toml

      # Phase 0's four spikes are answers rather than tests — they open windows
      # and measure things — so there is nothing here to run. Checking that they
      # still compile is what keeps the pinned revision honest for them too,
      # and it is the only reason this repository is now buildable from a fresh
      # checkout: both crates take Blitz as a pinned git revision rather than as
      # a path into a clone that has to be beside it.
      - name: The spike still compiles
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path experiments/dioxus-spike/Cargo.toml --bins
