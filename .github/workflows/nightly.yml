# **The rolling build, and the only thing that makes a download link out of a
# push.** Workflow artifacts are not that: they expire, they cannot be fetched
# without a GitHub account, and GitHub re-zips them. A release asset is a plain
# URL anybody can click.
#
# Every push to main replaces the `nightly` release with a build of that
# commit. It does not wait for `ci.yml`: the checks run on the same push, in
# parallel, and waiting would put fifty minutes between a merge and a
# downloadable build. A nightly that fails its tests is replaced by the next
# push; a nightly nobody can download is no use at all.
#
# It is marked `--latest`, which is the only thing the repository's front page
# reads: it shows the newest release that is neither a draft nor a prerelease.
# A nightly marked prerelease would leave the front page pointing at nothing at
# all today, and at a months-old version later. Newest wins, tag or main.
#
# The tag is deleted and recreated rather than moved, which is why the release
# is opened by a job of its own: four matrix jobs racing to create the same
# release is a coin flip, and one job creating it and four uploading into it is
# not. `nightly` does not match `v*`, and a tag pushed with `GITHUB_TOKEN`
# starts no workflow anyway, so there is no loop here.

name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A second push while the first is still packaging would delete the release the
# first is uploading into.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  open:
    name: Open the release
    runs-on: ubuntu-latest
    steps:
      - name: Replace the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "Built from \`main\` at commit \`${GITHUB_SHA:0:7}\`, and replaced by the next push to it. A link to this page is not a link to a fixed version; the numbered releases are."
          } > notes.md
          # The release first, which takes the tag with it, and then the tag
          # again in case a previous run left one without a release behind: a
          # stale tag would be reused, and the assets would be a build of this
          # commit hanging off a ref pointing at an older one.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" >/dev/null 2>&1 || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Development build" \
            --notes-file notes.md

  bundle:
    needs: open
    uses: ./.github/workflows/bundle.yml
    with:
      tag: nightly
    permissions:
      contents: write
