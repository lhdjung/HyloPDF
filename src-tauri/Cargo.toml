[package]
name = "hylopdf"
version = "0.1.0"
description = "HyloPDF — a smooth reading experience"
authors = ["HyloPDF contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hylopdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The name of this binary is what macOS shows in the Dock and what Windows
# shows in the task manager, and the crate is `hylopdf` because Cargo names are
# lower case by convention. `productName` in tauri.conf.json only renames the
# bundle around it, and `mainBinaryName` only takes effect at `tauri build` —
# so under `tauri dev`, which runs this binary with no bundle at all, the app
# was `hylopdf` on the screen. Naming the target is the one place that fixes
# both.
[[bin]]
name = "HyloPDF"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The shipped themes are read and checked at build time; see build.rs.
toml = "0.8"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The themes directory and the open document, watched rather than polled.
notify = "8"

# Already in the tree by way of tao; named here only to reach the three
# title-bar buttons, which Tauri does not expose.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Desktop only. `cfg(desktop)` is Tauri's own cfg, set by tauri-build; Cargo
# only understands the target triple, so the platforms are named directly.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
