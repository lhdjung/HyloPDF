[package]
name = "hylopdf"
version = "0.1.0"
description = "HyloPDF — a smooth reading experience"
authors = ["HyloPDF contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hylopdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Already in the tree by way of tao; named here only to reach the three
# title-bar buttons, which Tauri does not expose.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
