# Hylo Dark — the default dark theme.
# Not pure black on white: that contrast is tiring to read for long stretches.
name = "Hylo Dark"
order = 2
text = "#e9eaee"
background = "#24272f"
accent = "#8fb0d4"
# A calm blue for links: clearly not body text, and nowhere near a warning.
link = "#8ec5e8"
# The same warm red as Hylo Light's, banked down to sit on a dark page: the
# derived colour here is the accent's blue over a slate background, which is
# blue on blue, and the one hue this theme does not otherwise use reads at a
# glance where a lighter shade of the ground does not. A warm off-white on top
# rather than the theme's own cool ink, which would fight the band under it.
selection_area = "#7a4247"
selection_text = "#f8eeec"
