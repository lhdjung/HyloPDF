# Hylo Ember — the app's own icon, made readable.
# The icon is a coral page ruled in warm yellow, on a deep navy ground. At the
# size of a real page that coral is far too pale to read anything off, so the
# background here is the same hue banked down to an ember, the yellow of the
# rules becomes the ink, and the coral stays what it is on the icon: the accent.
name = "Hylo Ember"
order = 3
# The icon's rules, lifted a shade — a whole page of them wants more light than
# four lines on a coral card do.
text = "#f7e0a2"
background = "#83322a"
# The coral from the icon, lifted just enough to sit on the darker red.
accent = "#e9917f"
# The icon's page, brighter again. With yellow ink a warm amber link would be
# body text in a slightly different mood, so links take the icon's other colour
# instead of a warmer shade of its first one.
link = "#ffab93"
selection = "#b04a3d"
# A cream that leans yellow: the same ink, lit.
selection_text = "#fff6de"
