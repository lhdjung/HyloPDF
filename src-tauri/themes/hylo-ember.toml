# Hylo Ember — the app's own icon, made readable.
# The icon's page is a bright coral (#de7c6e); at full size behind a page of
# text it is far too pale to read white off, so the background is that same
# hue banked down to an ember and the coral becomes the accent instead.
name = "Hylo Ember"
order = 3
text = "#fdeeea"
background = "#83322a"
# The coral from the icon, lifted just enough to sit on the darker red.
accent = "#e9917f"
# Warm amber for links: still in the fire, clearly not body text.
link = "#f2c48a"
selection = "#b04a3d"
selection_text = "#fff4f0"
