# Nord — the arctic, north-bluish palette. Polar Night for the ground,
# Snow Storm for the ink, Frost for everything that has to stand out.
name = "Nord"
order = 9
text = "#d8dee9"
background = "#2e3440"
# Frost blue, the palette's own accent.
accent = "#88c0d0"
# A cooler frost for links, so they read as a different colour rather than a
# brighter version of the accent.
link = "#81a1c1"
# One Polar Night step lighter than the page is how the palette highlights a
# line, and it is far too quiet to be a selection. Frost, deepened until the
# Snow Storm on top of it still reads: the two halves of Nord, stacked.
selection = "#4c6a8f"
selection_text = "#eceff4"
